name: Nightly verification

# The bounded developer suite (ADR 0007 tiers 1 and 2) across the supported Python
# range. The remote-exhaustive tier lives in exhaustive.yml.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  developer-verification:
    name: Developer suite / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install -e ".[cutcell]"
      - run: make test-full
