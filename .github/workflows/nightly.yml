name: Nightly verification

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  full-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: make test-full
