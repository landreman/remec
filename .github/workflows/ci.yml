name: CI

on:
  pull_request:
  push:

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c .github/verification-constraints.txt -e ".[dev]"
      - run: python -m pip install -c .github/verification-constraints.txt --build-constraint .github/xfem-build-constraints.txt -e ".[cutcell]"
        if: matrix.os != 'ubuntu-24.04' || matrix.python != '3.10'
      - run: make check
      - run: make smoke
      - run: make wheel-smoke
