[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "remec"
version = "0.1.0.dev0"
description = "Regularized MHD Equilibrium Code"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "REMEC contributors" }]
dependencies = [
    "ngsolve>=6.2.2606,<6.3",
    # NumPy 2.5 stubs require a Python 3.12 type-check target; remec supports 3.10.
    "numpy>=1.24,<2.5",
    # The wide range lets pip choose Python-3.10 and Python-3.14 compatible minors.
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = [
    "build>=1.3,<2",
    "mypy>=1.18,<2",
    "pytest>=9,<10",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.14,<1",
]
cutcell = [
    "xfem>=2.1.2606,<2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-n", "3", "--dist=loadscope"]
markers = [
    "slow: bounded developer-runnable verification (about 90 seconds per test)",
    "exhaustive: remote-only large parameter ladder or benchmark",
    "sentinel(family): names the ADR 0007 verification family this test belongs to",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/remec"]
